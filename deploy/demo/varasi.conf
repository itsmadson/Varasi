# /root/nginx_config/conf.d/varasi.conf
# Varasi — single origin. Frontend + API/catalog/websocket, mirroring ai.conf.
# Replace 185.53.142.74 with the demo host IP and the ports with your .env values.

server {
    listen 443 ssl;
    http2 on;

    server_name varasi.geotajak.ir;

    include /etc/nginx/conf.d/includes/ssl-geotajak.conf;

    add_header Content-Security-Policy "frame-ancestors *" always;

    # Permit / GeoJSON / raster uploads.
    client_max_body_size 100M;

    # REST API (control-plane :8282)
    location /api/ {
        proxy_pass http://185.53.142.74:8282;
        include /etc/nginx/conf.d/includes/proxy-headers.conf;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Catalog tiles (control-plane proxies titiler/pgstac). Buffered, cacheable.
    location /catalog/ {
        proxy_pass http://185.53.142.74:8282;
        include /etc/nginx/conf.d/includes/proxy-headers.conf;
        proxy_read_timeout 120s;
    }

    # API docs / OpenAPI / health (control-plane root paths)
    location ~ ^/(docs|openapi.json|healthz|metrics) {
        proxy_pass http://185.53.142.74:8282;
        include /etc/nginx/conf.d/includes/proxy-headers.conf;
    }

    # WebSocket live feed
    location /ws {
        proxy_pass http://185.53.142.74:8282;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;
        proxy_buffering off;
    }

    # Frontend (Next.js :9292)
    location / {
        proxy_pass http://185.53.142.74:9292;
        include /etc/nginx/conf.d/includes/proxy-headers.conf;
        proxy_read_timeout 60s;
    }
}
